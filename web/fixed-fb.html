<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fixed Framebuffer (wasm)</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1a1818;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      /* The letterbox of a fixed-size framebuffer, and the backdrop of the canvas otherwise:
         black, which is what an opaque window promises (docs/adr/030 R9). */
      background: #000;
      outline: none;
      /* The element fills the viewport while the bitmap keeps its own size, so the two need not share
         an aspect ratio. `contain` fits the bitmap inside the element preserving its ratio and leaves
         the rest showing the background above; without it the bitmap is stretched to the element and a
         fixed-size framebuffer comes out distorted. `pixelated` makes the magnification
         nearest-neighbour, which is what a low-resolution framebuffer is for. */
      object-fit: contain;
      image-rendering: pixelated;
      cursor: default;
    }
  </style>
</head>
<body data-wasm="fixed_fb.wasm"
      data-audio-transport="none"
      data-shared="0">
  <canvas id="kngn-canvas" width="640" height="400" tabindex="0"></canvas>
  <!-- kngn:inline-module -->
  <script type="module" src="./kngn.js"></script>
</body>
</html>
