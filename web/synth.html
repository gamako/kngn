<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Synth (wasm)</title>
  <style>
    html, body { margin: 0; height: 100%; background: #101018; color: #ccc; font-family: system-ui, sans-serif; }
    #wrap { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 8px; }
    canvas {
      background: #181820;
      outline: none;
      image-rendering: pixelated;
      cursor: default;
    }
    #vp-audio-hint {
      display: none;
      padding: 8px 14px;
      background: #3a3020;
      border: 1px solid #c8a040;
      border-radius: 6px;
      color: #ffe8a0;
      cursor: pointer;
      user-select: none;
    }
    #vp-error {
      display: none;
      max-width: 40rem;
      padding: 10px;
      background: #401818;
      border: 1px solid #c04040;
      color: #ffc0c0;
      white-space: pre-wrap;
    }
    .note { font-size: 12px; opacity: 0.7; }
  </style>
</head>
<body data-wasm="synth.wasm" data-audio="1" data-shared="1">
  <div id="wrap">
    <canvas id="vp-canvas" width="1080" height="520" tabindex="0"></canvas>
    <div id="vp-audio-hint">Click or press a key to enable audio (browser autoplay policy)</div>
    <div id="vp-error"></div>
    <div class="note">A..K = C4..C5 · requires COOP/COEP (scripts/serve-web.py)</div>
  </div>
  <script type="module" src="./vp.js"></script>
</body>
</html>
